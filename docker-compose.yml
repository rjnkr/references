services:
  mariadb:
    image: mariadb:11
    container_name: tidalis-references-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-changeme_root}
      MYSQL_DATABASE: ${DB_NAME:-tidalis_references}
      MYSQL_USER: ${DB_USER:-tidalis}
      MYSQL_PASSWORD: ${DB_PASSWORD:-changeme}
    ports:
      - "3308:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mariadb-data:
